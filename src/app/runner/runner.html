<div class="layout-container">

  <header class="app-header">
    <div class="brand-section">
      <h1>🚶 Spaziergang</h1>
      <span class="subtitle">Wähle deine Strategie</span>
    </div>
    <div class="algorithm-nav">

      <button (click)="runGreedy()" class="btn btn-secondary">
        <span class="icon">⚡</span>
        <div class="btn-content">
          <span class="btn-title">Greedy</span>
          <span class="btn-desc">Schnell</span>
        </div>
      </button>

      <button (click)="runBeam()" class="btn btn-secondary">
        <span class="icon">🔦</span>
        <div class="btn-content">
          <span class="btn-title">Beam</span>
          <span class="btn-desc">Fokussiert</span>
        </div>
      </button>

      <div class="separator"></div>

      <button (click)="runSA()"  class="btn btn-secondary">
        <span class="icon">🎯</span>
        <div class="btn-content">
          <span class="btn-title">Simulated Annealing</span>
        </div>
      </button>

      <button (click)="runACO()" class="btn btn-secondary">
        <span class="icon">🎯</span>
        <div class="btn-content">
          <span class="btn-title">Ant Colony Optimization</span>
        </div>
      </button>


      <div class="separator"></div>

      <button (click)="runDijkstra()" class="btn btn-secondary">
        <span class="icon">🎯</span>
        <div class="btn-content">
          <span class="btn-title">Dijkstra</span>
          <span class="btn-desc">Exakt</span>
        </div>
      </button>

      <button (click)="runRoundDijkstra()" class="btn btn-secondary">
        <span class="icon">🔄</span>
        <div class="btn-content">
          <span class="btn-title">3-Punkt</span>
          <span class="btn-desc">Rundweg</span>
        </div>
      </button>

      <button (click)="runRoundAStar()" class="btn btn-secondary">
        <span class="icon">⭐</span>
        <div class="btn-content">
          <span class="btn-title">A* Runde</span>
          <span class="btn-desc">Smart</span>
        </div>
      </button>
    </div>
  </header>

  <div class="map-wrapper">
    <app-map [route]="currentRoute"></app-map>
  </div>

</div>
