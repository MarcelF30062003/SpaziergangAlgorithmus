<div class="layout-container">

  <header class="app-header">
    <div class="brand-section">
      <h1>🚶 Spaziergang</h1>
      <span class="subtitle">Wähle deine Strategie</span>
    </div>
    <div class="algorithm-nav">
      <button (click)="runGreedy()" class="btn btn-secondary">
        <span class="icon">⚡</span>
        <div class="btn-content"><span class="btn-title">Greedy</span></div>
      </button>
      <div class="separator"></div>
      <button (click)="runSA()"  class="btn btn-secondary">
        <span class="icon">🎯</span>
        <div class="btn-content"><span class="btn-title">SA</span></div>
      </button>
      <div class="separator"></div>
      <button (click)="runRoundDijkstra()" class="btn btn-secondary">
        <span class="icon">🔄</span>
        <div class="btn-content"><span class="btn-title">Dijkstra</span></div>
      </button>
    </div>

    <div *ngIf="currentQuality !== null" class="quality-badge fade-in">
      <div class="quality-label">Qualität</div>
      <div class="quality-value">{{ currentQuality | percent:'1.0-1' }}</div>
    </div>

  </header>

  <div class="map-wrapper">
    <app-map [route]="currentRoute" [startNode]="currentStartNode"></app-map>
  </div>

</div>
